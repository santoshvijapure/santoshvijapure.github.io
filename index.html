<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Dev Arcade & Portfolio | Santosh Vijapure</title>
  <meta name="description" content="Playable developer arcade games and Senior Software Engineer portfolio of Santosh Vijapure (Oportun, Airtel, Betaflux)." />
  <meta name="theme-color" content="#07090e" />

  <!-- Open Graph -->
  <meta property="og:title" content="Dev Arcade & Portfolio | Santosh Vijapure" />

  <link rel="stylesheet" href="css/app.css" />

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
